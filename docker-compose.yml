version: '3.8'
services:
  drupal:
    image: nconvox/v3rack:drush12
    ports:
      - "8080:80"
    depends_on:
      - postgres
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: a998a2353c3f2fac845905c3877ffd
      POSTGRES_DB: app
      POSTGRES_USER: app
networks:
  app-network:
    driver: bridge
