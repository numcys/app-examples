cms:
    drpinstance:
        type: drupal
        resources:
            - webdb
        drupalOptions:
            domain: drupal.test.demo.com
            siteName: Drupal from Manifest 
            adminUsername: convox
            adminPassword: convox
            email: admin@gmail.com
            modules:
                - drupal/token:^1.15
                - drupal/honeypot:^2.1
                - drupal/metatag:^2.0
            themes:
                - drupal/bootstrap:^3.32
        scale:
            min: 1
            max: 5

resources:
    webdb:
        type: postgres
        options:
            version: 16
